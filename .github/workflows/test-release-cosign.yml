# THROWAWAY workflow to validate console release signing on a fork.
# DELETE THIS FILE before opening upstream PR.

name: TEST Console Release + Cosign (fork only)

on:
  push:
    branches: [ test/console-cosign-release ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test-release:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0-test
    steps:
      - name: Checkout Console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Sample Web UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: device-management-toolkit/sample-web-ui
          ref: main
          path: ./temp

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - run: npm ci
        working-directory: ./temp

      - run: npm run build-enterprise
        working-directory: ./temp

      - name: Move web UI files
        run: mv ./temp/ui/browser/* ./internal/controller/httpapi/ui

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.23.0"

      - name: Build Linux x64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/linux/console_linux_x64 ./cmd/app

      - name: Build Linux x64 headless
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=noui -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/linux/console_linux_x64_headless ./cmd/app

      - name: Build Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/linux/console_linux_arm64 ./cmd/app

      - name: Build Linux arm64 headless
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=noui -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/linux/console_linux_arm64_headless ./cmd/app

      - name: Build Windows x64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/windows/console_windows_x64.exe ./cmd/app

      - name: Build Windows x64 headless
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags=noui -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/windows/console_windows_x64_headless.exe ./cmd/app

      - name: Build macOS arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/darwin/console_mac_arm64 ./cmd/app

      - name: Build macOS arm64 headless
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags=noui -ldflags "-s -w -X 'github.com/device-management-toolkit/console/internal/app.Version=$VERSION'" -trimpath -o dist/darwin/console_mac_arm64_headless ./cmd/app

      - name: Create archive artifacts via build.sh
        run: ./build.sh "$VERSION"

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: 'v3.0.2'

      - name: Sign binaries with Cosign
        env:
          COSIGN_SKIP_VERIFY: "1"
        run: ./sign.sh

      - name: Verify signatures (keyless, test workflow identity)
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CERT_IDENTITY="^https://github.com/${GH_REPO}/.github/workflows/test-release-cosign.yml@refs/heads/.*$"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          verify_blob() {
            artifact="$1"
            base_name="$(basename "$artifact")"
            cosign verify-blob \
              --bundle "${base_name}.cosign.bundle.json" \
              --certificate-identity-regexp "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$artifact"
          }

          verify_blob console_linux_x64.tar.gz
          verify_blob console_linux_x64_headless.tar.gz
          verify_blob console_linux_arm64.tar.gz
          verify_blob console_linux_arm64_headless.tar.gz
          verify_blob dist/windows/console_windows_x64.exe
          verify_blob dist/windows/console_windows_x64_headless.exe
          verify_blob console_mac_arm64.tar.gz
          verify_blob console_mac_arm64_headless.tar.gz

      - name: Upload signatures for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-cosign-signatures
          path: cosign-signatures.zip
          if-no-files-found: error

      - name: Upload built artifacts for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-release-artifacts
          path: |
            console_linux_x64.tar.gz
            console_linux_x64_headless.tar.gz
            console_linux_arm64.tar.gz
            console_linux_arm64_headless.tar.gz
            console_mac_arm64.tar.gz
            console_mac_arm64_headless.tar.gz
            dist/windows/console_windows_x64.exe
            dist/windows/console_windows_x64_headless.exe
          if-no-files-found: error

      - name: Create draft pre-release with signed artifacts
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.3.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.value }}
          name: "[TEST] Console Cosign signing ${{ steps.tag.outputs.value }}"
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          body: Throwaway draft release for console cosign workflow validation. Delete after inspection.
          files: |
            console_linux_x64.tar.gz
            console_linux_x64_headless.tar.gz
            console_linux_arm64.tar.gz
            console_linux_arm64_headless.tar.gz
            console_mac_arm64.tar.gz
            console_mac_arm64_headless.tar.gz
            dist/windows/console_windows_x64.exe
            dist/windows/console_windows_x64_headless.exe
            cosign-signatures.zip
